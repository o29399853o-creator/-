<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>覆工版／型鋼計算器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif;
            background:#dde3ea; height:100vh; display:flex; justify-content:center;
        }
        .app {
            width:100%; max-width:1000px; background:white;
            display:flex; flex-direction:column;
            box-shadow:0 0 30px rgba(0,0,0,0.15);
        }
        .header {
            background:linear-gradient(135deg,#1a3a5c,#2d6a9f);
            color:white; padding:12px 18px; flex-shrink:0;
        }
        .header h1 { font-size:17px; font-weight:700; letter-spacing:1px; }
        .header .params { margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; }
        .param-tag { background:rgba(255,255,255,0.18); border-radius:5px; padding:2px 8px; font-size:11px; }
        .main { flex:1; display:flex; overflow:hidden; min-height:0; }
        .left-panel { flex:1; display:flex; flex-direction:column; border-right:1px solid #e0e6ed; min-width:0; overflow:hidden; }
        .chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; }
        .bubble { max-width:88%; padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.6; white-space:pre-line; animation:pop 0.2s ease; }
        @keyframes pop { from{opacity:0;transform:scale(0.95) translateY(4px);}  to{opacity:1;transform:scale(1) translateY(0);} }
        .bot  { background:#f0f4f8; color:#1a1a1a; align-self:flex-start; border-bottom-left-radius:4px; }
        .user { background:#1a3a5c; color:#fff;    align-self:flex-end;   border-bottom-right-radius:4px; }
        .result-card { background:#f0f9f0; border:1.5px solid #66bb6a; border-radius:12px; padding:12px; align-self:stretch; animation:pop 0.25s ease; }
        .result-card h3 { font-size:12px; color:#2e7d32; margin-bottom:8px; }
        .result-card.steel { background:#f0f4ff; border-color:#6a8acc; }
        .result-card.steel h3 { color:#1a3a7a; }
        table { width:100%; border-collapse:collapse; font-size:11.5px; color:#333; }
        th { background:#e8f5e9; color:#2e7d32; padding:5px 4px; text-align:center; font-weight:600; }
        .steel th { background:#e8eeff; color:#1a3a7a; }
        td { padding:5px 4px; text-align:center; border-bottom:1px dashed #c8e6c9; }
        .steel td { border-bottom-color:#c8d4f0; }
        tr:last-child td { border-bottom:none; }
        .td-left { text-align:left; }
        .total-row td { font-weight:700; color:#1b5e20; border-top:2px solid #a5d6a7; border-bottom:none; padding-top:7px; }
        .steel .total-row td { color:#1a2a5a; border-top-color:#8aaad0; }
        .result-big { margin-top:8px; background:#2e7d32; color:white; border-radius:8px; text-align:center; padding:10px; }
        .result-big .num { font-size:34px; font-weight:700; }
        .result-big .label { font-size:12px; opacity:0.85; }
        .steel-box { margin-top:8px; background:#eef2ff; border:1.5px solid #8aaad0; border-radius:8px; padding:10px; font-size:12px; color:#1a2a5a; line-height:1.8; }
        .warn { font-size:10.5px; color:#bf360c; margin-top:7px; line-height:1.7; }
        .input-area { padding:10px 12px; border-top:1px solid #e8e8e8; background:white; flex-shrink:0; }
        .num-row { display:flex; gap:7px; }
        .num-input { flex:1; padding:9px 12px; border:2px solid #d0d7de; border-radius:9px; font-size:15px; font-family:inherit; outline:none; transition:border-color 0.2s; }
        .num-input:focus { border-color:#1a3a5c; }
        .send { padding:9px 14px; background:#1a3a5c; color:white; border:none; border-radius:9px; font-size:14px; cursor:pointer; font-family:inherit; }
        .send:hover { background:#2d5a8e; }
        .err { color:#c62828; font-size:11px; margin-top:4px; min-height:16px; }
        .restart { width:100%; padding:9px; background:#f5f5f5; color:#555; border:none; border-radius:7px; font-size:13px; cursor:pointer; font-family:inherit; }
        .restart:hover { background:#ebebeb; }
        .diagram-area { flex:2; background:#f8f6f0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        #dg { display:block; transition:opacity 0.26s ease; }
        .mode-tabs { display:flex; border-bottom:2px solid #e0e6ed; flex-shrink:0; }
        .tab-btn {
            flex:1; padding:9px 4px; border:none; background:transparent;
            font-size:12px; font-family:inherit; cursor:pointer;
            color:#7a8fa8; border-bottom:2px solid transparent; margin-bottom:-2px;
            transition:all 0.15s;
        }
        .tab-btn.active { color:#1a3a5c; font-weight:700; border-bottom-color:#1a3a5c; background:#f5f8fc; }
        .tab-btn:hover:not(.active) { background:#f0f4f8; color:#2255aa; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>覆工版 ／ 型鋼 計算器</h1>
        <div class="params">
            <span class="param-tag">版：3m × 1.5m × 15cm</span>
            <span class="param-tag">寬：15m（5排固定）</span>
            <span class="param-tag">深：60cm</span>
        </div>
    </div>
    <div class="main">
        <div class="left-panel">
            <div class="mode-tabs">
                <button class="tab-btn"        id="tab-boards" onclick="switchMode('boards')">全覆工版方案</button>
                <button class="tab-btn active" id="tab-steel"  onclick="switchMode('steel')">型鋼方案</button>
            </div>
            <div class="chat" id="chat"></div>
            <div class="input-area" id="inputArea"></div>
        </div>
        <div class="diagram-area" id="diagArea">
            <canvas id="dg"></canvas>
        </div>
    </div>
</div>
<script>
const BOARD_L=1.5, ROWS=5;

/* ── 全覆工版方案：各工序段長度 ── */
const stepsBoards=[
    {id:'l1',layers:4,q:'僅完成開挖、尚未鋪設任何材料的長度是幾公尺？\n\n（無此工序請輸入 0）'},
    {id:'l2',layers:2,q:'同時完成開挖及碎石級配鋪設的長度是幾公尺？\n\n（無此工序請輸入 0）'},
    {id:'l3',layers:1,q:'同時完成開挖、碎石級配及水泥級配鋪設的長度是幾公尺？\n\n（無此工序請輸入 0）'},
];

/* ── 型鋼方案：各工序段長度（問法同全覆工版方案） ── */
const stepsSteel=[
    {id:'l1',q:'僅完成開挖、尚未鋪設任何材料的長度是幾公尺？\n\n（無此工序請輸入 0）'},
    {id:'l2',q:'同時完成開挖及碎石級配鋪設的長度是幾公尺？\n\n（無此工序請輸入 0）'},
    {id:'l3',q:'同時完成開挖、碎石級配及水泥級配鋪設的長度是幾公尺？\n\n（無此工序請輸入 0）'},
];

const chat=document.getElementById('chat');
const inputArea=document.getElementById('inputArea');
const canvasEl=document.getElementById('dg');
let mode='steel', idx=0, answers={}, lastDraw=null;

function currentSteps(){ return mode==='boards' ? stepsBoards : stepsSteel; }

function switchMode(m){
    if(mode===m) return;
    mode=m;
    document.getElementById('tab-boards').classList.toggle('active', m==='boards');
    document.getElementById('tab-steel').classList.toggle('active',  m==='steel');
    restart();
}

function rnd(v){return Math.round(v*1e9)/1e9;}
function divides(a,b){const q=rnd(a/b);return Math.abs(q-Math.round(q))<1e-6;}

/* ── 型鋼長度組合計算：找 a×12 + b×9 = L ── */
function calcBeams(L){
    if(L===0) return {a:0,b:0};
    for(let a=Math.floor(L/12);a>=0;a--){
        const rem=rnd(L-a*12);
        if(rem>=0 && Math.abs(rem/9-Math.round(rem/9))<1e-6) return {a,b:Math.round(rem/9)};
    }
    return null;
}
/* 找 ≤ L 且最大的可整合型鋼長度 */
function bestBeamLen(L){
    if(L<=0) return 0;
    let best=0;
    for(let a=0;a*12<=L;a++){
        const b=Math.floor(rnd((L-a*12)/9));
        const c=a*12+b*9;
        if(c>best) best=c;
    }
    return best;
}

function addBubble(t,who){
    const d=document.createElement('div');
    d.className=`bubble ${who}`; d.textContent=t;
    chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}

/* ══════════════════════════
   CANVAS 設定
   ══════════════════════════ */
const VW=320, VH=480;

function setupCtx(){
    const DPR=window.devicePixelRatio||1;
    const area=document.getElementById('diagArea');
    const AW=area.clientWidth, AH=area.clientHeight;
    if(!AW||!AH) return null;
    const scale=Math.min(AW/VW, AH/VH)*DPR;
    canvasEl.width =Math.ceil(VW*scale);
    canvasEl.height=Math.ceil(VH*scale);
    canvasEl.style.width =canvasEl.width/DPR+'px';
    canvasEl.style.height=canvasEl.height/DPR+'px';
    const ctx=canvasEl.getContext('2d');
    ctx.setTransform(scale,0,0,scale,0,0);
    return ctx;
}

function fade(fn){ canvasEl.style.opacity='0'; setTimeout(()=>{fn(); canvasEl.style.opacity='1';},230); }

/* ── 材料定義 ── */
const MAT={
    ground:{ bg:'#3a3832', border:'#252520', label:'地面（±0）', labelC:'#c8d8b0' },
    bd:    { bg:'#f0a820', hi:'#fdd050', lo:'#c07010', border:'#a06008',
             label:'覆 工 版', sub:'15cm', labelC:'#fff8e0' },
    ctb:   { bg:'#9a9e90', hi:'#b8bdb0', lo:'#707868', border:'#585e50',
             label:'CTB 水泥處理層', sub:'15cm', labelC:'#f0f4e8' },
    cs:    { bg:'#c8984a', hi:'#e0b870', lo:'#966828', border:'#785020',
             label:'碎 石 底 層', sub:'15cm', labelC:'#fff0d8' },
    h450:  { bg:'#3e5870', hi:'#5a7a98', lo:'#243848', border:'#162438',
             label:'H450 型 鋼', sub:'45cm', labelC:'#d0e8f8' },
    h150:  { bg:'#3e5870', hi:'#5a7a98', lo:'#243848', border:'#162438',
             label:'H150 型 鋼', sub:'15cm', labelC:'#d0e8f8' },
};

/* ── 材質紋理 ── */
function drawBoardTex(ctx,x,y,w,h){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    ctx.strokeStyle='rgba(160,80,0,0.45)'; ctx.lineWidth=1.2;
    for(let i=1;i<5;i++){
        const bx=x+i*(w/5);
        ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx,y+h); ctx.stroke();
    }
    ctx.strokeStyle='rgba(200,120,0,0.22)'; ctx.lineWidth=0.7;
    for(let dy=4; dy<h; dy+=6){
        ctx.beginPath(); ctx.moveTo(x,y+dy); ctx.lineTo(x+w,y+dy); ctx.stroke();
    }
    ctx.restore();
}

function drawStoneTex(ctx,x,y,w,h){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    const stones=[
        [0.08,0.3,0.055,0.18,-20],[0.22,0.65,0.045,0.15,15],[0.35,0.22,0.06,0.2,-30],
        [0.50,0.55,0.052,0.17,10],[0.63,0.25,0.058,0.19,-15],[0.78,0.60,0.048,0.16,25],
        [0.14,0.78,0.05,0.18,35],[0.42,0.80,0.055,0.17,-10],[0.70,0.82,0.05,0.16,20],
        [0.88,0.30,0.048,0.16,-25],[0.55,0.88,0.04,0.13,30],[0.28,0.45,0.042,0.14,5],
        [0.92,0.68,0.04,0.13,-20],[0.06,0.55,0.038,0.13,40],
    ];
    stones.forEach(([rx,ry,rw,rh,ang])=>{
        ctx.save();
        ctx.translate(x+rx*w,y+ry*h); ctx.rotate(ang*Math.PI/180);
        ctx.beginPath(); ctx.ellipse(0,0,rw*w,rh*h,0,0,Math.PI*2);
        ctx.fillStyle='rgba(110,72,20,0.48)'; ctx.fill();
        ctx.strokeStyle='rgba(80,50,10,0.3)'; ctx.lineWidth=0.5; ctx.stroke();
        ctx.restore();
    });
    ctx.restore();
}

function drawCTBTex(ctx,x,y,w,h){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    const pts=[[0.1,0.3],[0.25,0.7],[0.38,0.2],[0.52,0.55],[0.65,0.15],[0.79,0.72],
               [0.15,0.82],[0.44,0.85],[0.7,0.4],[0.88,0.25],[0.92,0.68],[0.05,0.55]];
    pts.forEach(([rx,ry])=>{
        ctx.beginPath(); ctx.arc(x+rx*w,y+ry*h,1.8,0,Math.PI*2);
        ctx.fillStyle='rgba(80,85,70,0.45)'; ctx.fill();
    });
    ctx.restore();
}

function drawHBeamTex(ctx,x,y,w,h){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    const laneW=w/5;
    for(let i=0;i<5;i++){
        const cx=x+(i+0.5)*laneW;
        const fw=Math.min(laneW*0.52,28);
        const fh=Math.max(h*0.11,2.5);
        const tw=Math.max(fw*0.14,1.5);
        const innerH=h-2*fh-8;
        ctx.fillStyle='rgba(20,50,80,0.45)';
        ctx.fillRect(cx-fw/2,y+4,fw,fh);
        ctx.fillRect(cx-tw/2,y+4+fh,tw,innerH);
        ctx.fillRect(cx-fw/2,y+h-fh-4,fw,fh);
        ctx.fillStyle='rgba(120,180,220,0.18)';
        ctx.fillRect(cx-fw/2,y+4,fw,fh*0.45);
    }
    ctx.restore();
}

/* ── 通用材料帶繪製 ── */
function drawBand(ctx,x,y,w,h,matKey,boardCount){
    const m=MAT[matKey];
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,m.hi); g.addColorStop(0.5,m.bg); g.addColorStop(1,m.lo);
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
    if(matKey==='bd')              drawBoardTex(ctx,x,y,w,h);
    if(matKey==='cs')              drawStoneTex(ctx,x,y,w,h);
    if(matKey==='ctb')             drawCTBTex(ctx,x,y,w,h);
    if(matKey==='h450'||matKey==='h150') drawHBeamTex(ctx,x,y,w,h);
    ctx.strokeStyle=m.border; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`bold 12px 'Microsoft JhengHei',sans-serif`;
    ctx.fillStyle=m.labelC;
    ctx.fillText(m.label,x+w/2,y+h/2-6);
    ctx.font=`9px 'Microsoft JhengHei',sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.fillText(m.sub,x+w/2,y+h/2+8);
    if(matKey==='bd' && boardCount>1){
        const bw=52,bh=16,bx=x+w-bw-6,by2=y+h-bh-5;
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath(); roundRect2(ctx,bx,by2,bw,bh,4); ctx.fill();
        ctx.font=`bold 9px sans-serif`; ctx.fillStyle='#ffe080'; ctx.textAlign='left';
        ctx.fillText(`共 ${boardCount} 層`,bx+6,by2+bh/2);
        ctx.textAlign='center';
    }
}

function roundRect2(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function arrowV(ctx,x,y0,y1,col,lw=0.9){
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
    [[y0,1],[y1,-1]].forEach(([y,d])=>{
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y+d*5); ctx.lineTo(x+3,y+d*5); ctx.closePath(); ctx.fill();
    });
}

function arrowH(ctx,x0,x1,y,col,lw=0.9){
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    [[x0,1],[x1,-1]].forEach(([x,d])=>{
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+d*5,y-3); ctx.lineTo(x+d*5,y+3); ctx.closePath(); ctx.fill();
    });
}

function label(ctx,x,y,s,{sz=10,c='#555',b=false,al='center'}={}){
    ctx.font=`${b?'bold ':''}${sz}px 'Microsoft JhengHei',sans-serif`;
    ctx.fillStyle=c; ctx.textAlign=al; ctx.textBaseline='middle';
    ctx.fillText(s,x,y);
}

/* ════════════════════════════════════════
   全覆工版方案：Q&A 斷面圖
   ════════════════════════════════════════ */
function drawSection(stage){
    lastDraw=()=>drawSection(stage);
    fade(()=>{
        const ctx=setupCtx(); if(!ctx) return;
        const FILL_N=[0,2,3][stage];
        ctx.fillStyle='#f5f2eb'; ctx.fillRect(0,0,VW,VH);

        const BX=72,BY=96,BW=190,GH=22,LH=52,N=4;
        const SECT_TOP=BY+GH, SECT_BOT=SECT_TOP+N*LH;

        const TITLES=['① 開挖完成','② 碎石完成','③ 水泥完成'];
        label(ctx,VW/2,26,TITLES[stage],{sz:16,c:'#1a3a5c',b:true});
        label(ctx,VW/2,48,'開挖斷面示意圖（縱向剖面）',{sz:9.5,c:'#8899aa'});

        const BCOLS=['#e06800','#7d5c3c','#2850a0'];
        const BTEXT=['全深 60cm　尚未回填','碎石完成　剩 30cm','水泥完成　剩 15cm'];
        ctx.fillStyle=BCOLS[stage];
        roundRect2(ctx,BX,BY-36,BW,26,5); ctx.fill();
        label(ctx,BX+BW/2,BY-23,BTEXT[stage],{sz:10,c:'#fff',b:true});

        ctx.fillStyle=MAT.ground.bg; ctx.fillRect(BX,BY,BW,GH);
        ctx.strokeStyle=MAT.ground.border; ctx.lineWidth=1; ctx.strokeRect(BX,BY,BW,GH);
        label(ctx,BX+BW/2,BY+GH/2,MAT.ground.label,{sz:9.5,c:MAT.ground.labelC,b:true});

        function getMat(slot){
            if(slot>=FILL_N) return 'bd';
            if(slot===2) return 'ctb';
            return 'cs';
        }

        let boardGroupStart=-1, boardGroupCount=0;
        for(let row=0;row<N;row++){
            const slot=N-1-row;
            const matKey=getMat(slot);
            const ly=SECT_TOP+row*LH;
            if(matKey==='bd'){ if(boardGroupStart<0) boardGroupStart=row; boardGroupCount++; }
            drawBand(ctx,BX,ly,BW,LH,matKey,0);
        }

        if(boardGroupCount>0){
            const ly=SECT_TOP+boardGroupStart*LH;
            const bH=boardGroupCount*LH;
            const bdgW=80,bdgH=20,bdgX=BX+BW-bdgW-8,bdgY=ly+8;
            ctx.fillStyle='rgba(0,0,0,0.35)';
            roundRect2(ctx,bdgX,bdgY,bdgW,bdgH,5); ctx.fill();
            label(ctx,bdgX+bdgW/2,bdgY+bdgH/2,`覆工版 ${boardGroupCount} 層 = ${boardGroupCount*15}cm`,{sz:8.5,c:'#ffe080',b:true});
        }

        ctx.strokeStyle='#a0b890'; ctx.lineWidth=1.5;
        ctx.strokeRect(BX,BY,BW,GH+N*LH);

        const AX=BX-28;
        arrowV(ctx,AX,SECT_TOP,SECT_BOT,'#6688aa');
        ctx.save(); ctx.translate(AX-12,(SECT_TOP+SECT_BOT)/2); ctx.rotate(-Math.PI/2);
        label(ctx,0,0,'60cm（開挖深度）',{sz:9,c:'#336688',b:true});
        ctx.restore();

        const RX=BX+BW+10;
        for(let row=0;row<N;row++){
            const slot=N-1-row;
            const matKey=getMat(slot);
            const m=MAT[matKey];
            const ly=SECT_TOP+row*LH+LH/2;
            ctx.strokeStyle=m.border; ctx.lineWidth=0.8;
            ctx.beginPath(); ctx.moveTo(BX+BW,ly); ctx.lineTo(RX+4,ly); ctx.stroke();
            ctx.beginPath(); ctx.arc(RX+4,ly,2,0,Math.PI*2);
            ctx.fillStyle=m.bg; ctx.fill(); ctx.stroke();
            label(ctx,RX+8,ly-5,m.label.replace(/　/g,''),{sz:8.5,c:'#2a3a20',b:true,al:'left'});
            label(ctx,RX+8,ly+5,m.sub,{sz:8,c:'#667760',al:'left'});
        }

        const WY=SECT_BOT+18;
        arrowH(ctx,BX,BX+BW,WY,'#6688aa');
        label(ctx,BX+BW/2,WY+12,'15m（開挖寬度）',{sz:9,c:'#336688',b:true});

        const boardLayers=4-FILL_N;
        const SY=WY+36;

/* 各步驟餘數用全覆工版的層數：開挖60cm→4層、碎石30cm→2層、水泥15cm→1層 */
const STEEL_REM_LAYERS=[4,2,1];

function calcSteelStep(L,stepIdx){
    if(L===0) return {hLen:0,rem:0,beams:{a:0,b:0},hBoards:0,remBoards:0,totalBoards:0};
    if(stepIdx===2){
        const boards=ROWS*Math.floor(rnd(L/BOARD_L));
        return {hLen:0,rem:L,beams:{a:0,b:0},hBoards:0,remBoards:boards,totalBoards:boards};
    }
    const hLen=bestBeamLen(L);
    const rem=rnd(L-hLen);
    const beams=calcBeams(hLen)||{a:0,b:0};
    const hBoards=ROWS*Math.floor(rnd(hLen/BOARD_L));
    const remBoards=ROWS*Math.floor(rnd(rem/BOARD_L))*STEEL_REM_LAYERS[stepIdx];
    return {hLen,rem,beams,hBoards,remBoards,totalBoards:hBoards+remBoards};
}

    let html=`<h3>型鋼方案計算結果</h3>
<table>
  <thead><tr><th>段落</th><th>長度</th><th>覆工版(片)</th><th>型鋼(支)</th></tr></thead>
  <tbody>${trs}
  <tr class="total-row"><td class="td-left" colspan="2">覆工版合計</td><td>${totalBoards}</td><td></td></tr>
  </tbody>
</table>
<div class="result-big" style="background:#1a3070">
  <div class="num">${totalBoards.toLocaleString()}</div>
  <div class="label">片覆工版</div>
</div>`;

    if(totalBeams>0){
        html+=`<div class="steel-box">
<b>型鋼數量：</b><br>
H450×300×15×23mm：12m × ${h450_12}支 ＋ 9m × ${h450_9}支<br>
H150×150×7×10mm：12m × ${h150_12}支 ＋ 9m × ${h150_9}支<br>
<b>型鋼合計：${totalBeams} 支</b>
</div>`;
    }

    card.innerHTML=html;
    chat.appendChild(card);chat.scrollTop=chat.scrollHeight;renderRestart();
}

/* ══ 輸入處理 ══ */
function handleNumber(){
    const input=document.getElementById('ni');
    const errEl=document.getElementById('err');
    let val=parseFloat(input.value);
    errEl.textContent='';
    if(isNaN(val)||val<0){errEl.textContent='請輸入有效數值（≥ 0）';return;}

    if(mode==='boards'){
        if(val>0){
            const rounded=Math.ceil(rnd(val/1.5))*1.5;
            if(rounded!==val) addBubble(`${val}m 無條件進位至 ${rounded}m（覆工版長度 1.5m 的倍數）`,'bot');
            val=rounded;
        }
    } else {
        /* 型鋼方案：無條件進位到1.5m倍數，不足型鋼整合的餘數用全覆工版補 */
        if(val>0){
            const rounded=Math.ceil(rnd(val/1.5))*1.5;
            if(rounded!==val) addBubble(`${val}m 無條件進位至 ${rounded}m（覆工版長度 1.5m 的倍數）`,'bot');
            val=rounded;
        }
    }

    const steps=currentSteps();
    answers[steps[idx].id]=val;
    addBubble(`${val} m`,'user');
    advance();
}

/* ══ 問答流程 ══ */
function advance(){
    const steps=currentSteps();
    idx++;
    if(idx<steps.length){
        const s=steps[idx];
        const drawFn=mode==='boards'?()=>drawSection(idx):()=>drawSteelSection(idx);
        setTimeout(()=>{addBubble(s.q,'bot');renderInput();drawFn();},350);
    } else {
        if(mode==='boards'){
            setTimeout(()=>{showResultBoards();drawResultSections(answers.l1,answers.l2,answers.l3);},350);
        } else {
            setTimeout(()=>{showResultSteel();drawSteelResultSections(answers.l1,answers.l2,answers.l3);},350);
        }
    }
}

function renderInput(){
    inputArea.innerHTML=`<div class="num-row"><input id="ni" class="num-input" type="number" min="0" step="any" placeholder="輸入長度（m）"><button class="send" id="sb">確認</button></div><div class="err" id="err"></div>`;
    document.getElementById('sb').addEventListener('click',handleNumber);
    document.getElementById('ni').addEventListener('keydown',e=>{if(e.key==='Enter')handleNumber();});
    setTimeout(()=>document.getElementById('ni')?.focus(),50);
}

function renderRestart(){
    inputArea.innerHTML=`<button class="restart" id="rb">↺ 重新計算</button>`;
    document.getElementById('rb').addEventListener('click',restart);
}

function restart(){
    answers={}; idx=0; chat.innerHTML='';
    const steps=currentSteps();
    addBubble(steps[0].q,'bot');
    renderInput();
    if(mode==='boards') drawSection(0);
    else drawSteelSection(0);
}

restart();
</script>
